# =============================================================================
# ВАРИАНТ Б: отдельный поддомен sso.kodeks.expert НА НАШЕМ СЕРВЕРЕ (45.10.41.70)
# Файл: /etc/nginx/sites-available/sso.kodeks.expert
#
# Когда серверы каталогов трогать нельзя. Требуется от владельца зоны kodeks.expert:
#   1) DNS-запись:  sso.kodeks.expert  A  45.10.41.70
#   2) TLS-сертификат на sso.kodeks.expert (можно Let's Encrypt после DNS)
#
# Отличие от варианта А: auth-api должен ставить куки с Domain=.kodeks.expert
# (иначе кука останется host-only на sso.* и до cabinet-0X не доедет).
# Это флаг в нашем endpoint (см. план работ — SSO_COOKIE_DOMAIN=.kodeks.expert).
#
# Флоу: браузер -> https://sso.kodeks.expert/sso?ticket=...&path=...&host=cabinet-03.kodeks.expert
#       -> auth-api логинит, Set-Cookie Domain=.kodeks.expert, 302 -> https://cabinet-03.../docs/...
# =============================================================================

server {
    listen 443 ssl http2;
    server_name sso.kodeks.expert;

    ssl_certificate     /etc/letsencrypt/live/sso.kodeks.expert/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sso.kodeks.expert/privkey.pem;

    # На этом хосте живёт ТОЛЬКО /sso — всё прочее 404.
    location = /sso {
        proxy_pass http://127.0.0.1:8000/api/expert/sso$is_args$args;   # auth-api локально
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name sso.kodeks.expert;
    return 301 https://$host$request_uri;
}
