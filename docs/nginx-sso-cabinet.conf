# =============================================================================
# ВАРИАНТ А: nginx НА СЕРВЕРЕ КАТАЛОГОВ (перед приложением Кодекс)
# Файл: /etc/nginx/sites-available/cabinet-03.kodeks.expert  (по одному на кабинет)
#
# Суть: браузер пользователя приходит на /sso ПРЯМО НА ДОМЕНЕ КАБИНЕТА,
# nginx проксирует этот единственный путь в наш Auth API (45.10.41.70:8000),
# который логинит пользователя и отвечает Set-Cookie + 302 в кабинет.
# Куки получаются first-party (домен кабинета) — браузер их принимает.
#
# ЕСЛИ NGINX УЖЕ СТОИТ перед каталогом — добавьте ТОЛЬКО блок "location = /sso"
# в существующий server {}. Полный server ниже — для случая, когда nginx ставится с нуля.
# =============================================================================

server {
    listen 443 ssl http2;
    server_name cabinet-03.kodeks.expert;      # <-- поменять под каждый кабинет (02..07)

    # TLS: существующие сертификаты каталога (пути уточнить на сервере)
    ssl_certificate     /etc/ssl/kodeks/fullchain.pem;      # <-- УТОЧНИТЬ ПУТЬ
    ssl_certificate_key /etc/ssl/kodeks/privkey.pem;        # <-- УТОЧНИТЬ ПУТЬ

    # -------------------------------------------------------------------------
    # SSO-шлюз: единственный новый путь. Всё остальное поведение каталога не меняется.
    # -------------------------------------------------------------------------
    location = /sso {
        # наш Auth API; $is_args$args пробрасывает ?ticket=...&path=...
        proxy_pass http://45.10.41.70:8000/api/expert/sso$is_args$args;

        proxy_set_header Host $host;                    # auth-api по Host понимает, какой кабинет
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;

        # Set-Cookie из ответа auth-api уходит браузеру КАК ЕСТЬ (host-only кука кабинета).
        # Ничего не переписываем: proxy_cookie_domain/path НЕ нужны.
    }

    # -------------------------------------------------------------------------
    # Всё остальное — в приложение каталога, как было до nginx.
    # УТОЧНИТЬ upstream: на каком локальном порту слушает Кодекс-приложение.
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8080;               # <-- УТОЧНИТЬ ПОРТ КАТАЛОГА
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        client_max_body_size 100m;
    }
}

# HTTP -> HTTPS (если ещё нет)
server {
    listen 80;
    server_name cabinet-03.kodeks.expert;
    return 301 https://$host$request_uri;
}
