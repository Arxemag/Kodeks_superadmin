# Managed by Kodeks superadmin SSO installer.
# Keep this endpoint out of access logs: its query contains a one-time ticket.
location = /sso {
    proxy_pass http://127.0.0.1:8000/api/expert/sso;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
    proxy_send_timeout 45s;
    proxy_redirect off;
    proxy_cache off;
    proxy_next_upstream off;
    access_log off;
    # Upstream error messages can also include the original request query.
    error_log /dev/null crit;
}
