name: Tests

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, release]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and mocked integration tests
        run: python -m pytest tests integration/itrhub-production/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Portal SSO policy and browser-opening tests
        run: node --experimental-strip-types --test integration/itrhub-production/tests/policy.test.mjs integration/itrhub-production/tests/frontend.test.mjs
