# Kodeks superadmin: Auth API (8000) + единый Kafka worker + chromium (для Playwright).
# БД — ВНЕШНЯЯ (уже стоит на сервере). В .env: DB_URL на host.docker.internal:5432 (см. extra_hosts),
# KAFKA_BOOTSTRAP_SERVERS на брокер. chromium наружу НЕ публикуется (нужен только воркеру по сети compose).
services:
  chromium:
    image: browserless/chrome:latest
    environment:
      - PORT=3000
      - CONNECTION_TIMEOUT=120000
      - MAX_CONCURRENT_SESSIONS=5
      - PREBOOT_CHROME=true
    restart: unless-stopped

  auth-api:
    build: .
    command: ["python", "main.py"]
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file: .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CHROMIUM_WS_ENDPOINT=${CHROMIUM_WS_ENDPOINT:-ws://chromium:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # доступ к postgres/kafka, опубликованным на хосте
    depends_on:
      - chromium
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "main_unified_worker.py"]
    env_file: .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CHROMIUM_WS_ENDPOINT=${CHROMIUM_WS_ENDPOINT:-ws://chromium:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - chromium
    restart: unless-stopped
